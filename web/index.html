<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSPBETS</title>
  <link rel="stylesheet" href="/web/style.css">
  <style>
    .history-card { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    .history-title { font-weight: bold; color: #fff; }
    .history-status { font-weight: bold; }
    .crash-graph { width: 100%; height: 150px; background: #111; border: 1px solid #333; border-radius: 8px; margin: 10px 0; position: relative; overflow: hidden; }
    .crash-multiplier { font-size: 36px; font-weight: bold; text-align: center; margin: 10px 0; }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="glow"></div>
  <header>
    <div class="brand">MSP<span>BETS</span></div>
    <div class="balance"><small>БАЛАНС</small><b id="balance">—</b> <span>PTS</span></div>
  </header>
  <main>
    <section class="hero"><h1>ТВОЯ ИГРА.<br><span>ТВОИ БАЛЛЫ.</span></h1></section>
    
    <nav style="overflow-x: auto; white-space: nowrap; display: flex; gap: 10px; padding-bottom: 5px;">
      <button class="tab active" data-tab="matches">Матчи</button>
      <button class="tab" data-tab="crash">Краш</button>
      <button class="tab" data-tab="history">История</button>
      <button class="tab" data-tab="cases">Кейсы</button>
      <button class="tab admin-only hidden" data-tab="admin">Админка</button>
    </nav>

    <section id="matches" class="panel">
      <div id="event-list"></div>
    </section>

    <section id="crash" class="panel hidden">
      <div class="section-title">КРАШ</div>
      <div class="crash-graph" id="crash-graph-container">
        <div id="crash-line" style="position: absolute; bottom: 0; left: 0; height: 0; width: 100%; background: linear-gradient(to right, rgba(85,255,0,0.2), #55ff00); border-radius: 4px; transition: height 0.05s;"></div>
      </div>
      <div class="crash-multiplier" id="crash-mult" style="color: #55ff00;">1.00x</div>
      <div id="crash-status" style="text-align: center; margin-bottom: 15px; font-weight: bold; color: #fff;">Ожидание...</div>
      
      <div class="admin-form">
        <input id="crash-bet" type="number" min="1" placeholder="Сумма ставки" value="100">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button id="crash-start-btn" class="primary" onclick="startCrash()" style="flex: 1;">Старт</button>
          <button id="crash-cashout-btn" class="primary" onclick="cashoutCrash()" style="flex: 1; background: #ffaa00; color: #000;" disabled>Забрать</button>
        </div>
      </div>
    </section>

    <section id="history" class="panel hidden">
      <div class="section-title">ИСТОРИЯ СТАВОК</div>
      <div id="history-list"></div>
    </section>

    <section id="cases" class="panel hidden">
      <div class="section-title">КЕЙСЫ</div>
      <div id="cases-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
      <div id="case-result-text" style="display: none; margin-top: 20px; text-align: center;"></div>
    </section>

    <section id="admin" class="panel hidden">
      <div class="section-title">АДМИН-ПАНЕЛЬ</div>
      
      <div class="section-title sub">УПРАВЛЕНИЕ БАЛЛАМИ</div>
      <form id="admin-points-form" class="admin-form" style="margin-bottom: 24px;">
        <input id="admin-target" type="text" placeholder="ID или @username" required>
        <div style="display: flex; gap: 8px;">
          <select id="admin-points-action" style="flex: 1;">
            <option value="add">Начислить</option>
            <option value="remove">Списать</option>
          </select>
          <input id="admin-points-amount" type="number" min="1" placeholder="Сумма" required style="flex: 1;">
        </div>
        <button class="primary" type="submit">Применить</button>
      </form>

      <div class="section-title sub">ДОБАВИТЬ МАТЧ</div>
      <form id="admin-event-form" class="admin-form" style="margin-bottom: 24px;">
        <select id="admin-sport"><option>CS2</option><option>Dota 2</option><option>Футбол</option><option>Теннис</option></select>
        <input id="admin-title" placeholder="Команда А — Команда Б" required>
        <div style="display: flex; gap: 8px;">
          <input id="admin-o1" type="number" step="0.01" placeholder="Кф. П1" required style="flex:1;">
          <input id="admin-ox" type="number" step="0.01" placeholder="Кф. X" style="flex:1;">
          <input id="admin-o2" type="number" step="0.01" placeholder="Кф. П2" required style="flex:1;">
        </div>
        <button class="primary" type="submit">Добавить</button>
      </form>

      <div class="section-title sub">РАСЧЁТ МАТЧЕЙ</div>
      <div id="settle-list"></div>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/web/app.js"></script>
</body>
</html>
