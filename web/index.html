<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSPBETS</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="glow"></div>
  <header>
    <div class="brand">MSP<span>BETS</span></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="https://t.me/mspbetsprizi" target="_blank" style="text-decoration: none; background: #1a1a1a; color: #55ff00; border: 1px solid #55ff00; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 4px;">📢 Канал</a>
      <button id="btn-promo" style="background: #1a1a1a; color: #55ff00; border: 1px solid #55ff00; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;">🎁 Промо</button>
      <div class="balance"><small>БАЛАНС</small><b id="balance">—</b> <span>PTS</span></div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">SPORTS PREDICTIONS</div>
      <h1>ТВОЯ ИГРА.<br><span>ТВОИ БАЛЛЫ.</span></h1>
      <p>Делай прогнозы на матчи и поднимайся в рейтинге.</p>
      <small class="disclaimer">Только виртуальные баллы. Без денежных ставок и вывода средств.</small>
    </section>
    <nav>
      <button class="tab active" data-tab="matches">Матчи</button>
      <button class="tab" data-tab="cases">Кейсы</button>
      <button class="tab" data-tab="rating">Рейтинг</button>
      <button class="tab admin-only hidden" data-tab="admin">Админка</button>
    </nav>
    <section id="matches" class="panel">
      <div class="section-title">АКТИВНЫЕ МАТЧИ</div>
      <div id="event-list"><div class="empty">Загружаем матчи...</div></div>
    </section>
    
    <!-- КЕЙСЫ И АПГРЕЙДЕР -->
    <section id="cases" class="panel hidden">
      <div class="section-title">КЕЙСЫ DOTA 2</div>
      <div id="cases-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
      
      <!-- Окно прокрута кейса -->
      <div id="case-result" style="margin-top: 20px; text-align: center; overflow: hidden; width: 100%; position: relative; min-height: 100px;">
        <div id="case-strip" style="display: none; display: flex; gap: 10px; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); transform: translateX(0);"></div>
        <div id="case-pointer" style="display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #55ff00; box-shadow: 0 0 10px #55ff00; z-index: 10;"></div>
        <div id="case-result-text" style="display: none; margin-top: 20px;"></div>
      </div>

      <div class="section-title sub" style="margin-top: 40px;">АПГРЕЙДЕР</div>
      <div id="inventory-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>

      <!-- Окно апгрейдера -->
      <div id="upgrade-result" style="margin-top: 20px; text-align: center; overflow: hidden; width: 100%; position: relative; min-height: 100px; display: none;">
        <div id="upgrade-strip" style="display: flex; gap: 10px; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); transform: translateX(0);"></div>
        <div id="upgrade-pointer" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #55ff00; box-shadow: 0 0 10px #55ff00; z-index: 10;"></div>
        <div id="upgrade-text" style="display: none; margin-top: 20px;"></div>
      </div>
    </section>

    <section id="rating" class="panel hidden">
      <div class="section-title">ТОП ИГРОКОВ</div>
      <div id="rating-list" class="empty">Загружаем рейтинг...</div>
    </section>
    
    <!-- АДМИНКА (оставил как было) -->
    <section id="admin" class="panel hidden">
       <!-- ... твой старый блок админки ... -->
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/web/app.js"></script>
</body>
</html>
