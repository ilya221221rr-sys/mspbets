services:
  - type: web
    name: mspbets
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: mspbetsbot
      - key: BOT_WEBAPP_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: mspbets.db
